 if(m==='LOCKED'){tz=a[6];tx=a[4];ty=a[5]}else if(m==='PUSH')tz=1+.25*ea;else if(m==='PULL')tz=1.3-.3*ea;

/* ---------- export ---------- */

const FM={'9:16':[720,1280],'16:9':[1280,720],'1:1':[960,960]};
function wwFor(f){const[ow,oh]=FM[f],ar=ow/oh;return ar>1.2?Math.max(W,H*ar):Math.max(W*(f==='1:1'?.8:.72),H*ar)}
function viewOf(exp){return{list:RP.list,cam:RP.cam,mat:RP.mat,col:RP.col,cur:RP.cur,en:cl(RP.en/1500,0,1),floor:RP.mode===0,gl:RP.gl,exp}}

 const mime=mimeTypes.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
 const opts={videoBitsPerSecond:6e6};if(mime)opts.mimeType=mime;
 const rec=new MediaRecorder(ec.captureStream(30),opts),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);

 rec.onstop=()=>{doc.classList.remove('prog');const blob=new Blob(ch,{type:mime||'video/webm'});RP.blob=blob;RP.ext=ext;RP.play=false;$('#vid').src=URL.createObjectURL(blob);doc.classList.add('res');snd('done')};
 RP.exp={ec,ex,ow,oh,ww:wwFor(S.fmt),rec};RP.t=0;RP.dir=1;RP.speed=1;RP.play=true;doc.classList.add('prog');rec.start()}

/* ---------- pointer ---------- */
const pts=new Map();let pd0=0,pz0=1,lastTap={t:0,x:0,y:0};
const w2=e=>[W/2+(e.clientX-W/2)/CAM.z-CAM.x,H/2+(e.clientY-H/2)/CAM.z-CAM.y];

 if(S.remove){
  let hit=false,best=null,bd=1e9;
  B.forEach(b=>{if(b.hide)return;const d=Math.hypot(b.x-C.x,b.y-C.y);if(d<b.r*1.35+16&&d<bd){best=b;bd=d}});
  if(best){ring(best.x,best.y,20,480,.8,3);snd('boom');B=B.filter(b=>b!==best);if(S.parents)S.parents=S.parents.filter(p=>p!==best);structChanged();toast('PARTICLE REMOVED');hit=true}
  for(let i=0;i<NP;i++){if(pl[i]<=0)continue;const dx=px[i]-C.x,dy=py[i]-C.y;if(dx*dx+dy*dy<2025){pl[i]=0;hit=true}}
  if(hit&&!best){ring(C.x,C.y,10,320,.5,2);snd('burst')}
  return}
 const n=performance.now();if(doc.classList.contains('lab')&&n-lastTap.t<320&&Math.hypot(C.x-lastTap.x,C.y-lastTap.y)<50){explode(C.x,C.y);lastTap.t=0;return}lastTap={t:n,x:C.x,y:C.y};
 C.down=true;let best=null,bd=1e9;B.forEach(b=>{if(b.hide||b.reb)return;const d=Math.hypot(b.x-C.x,b.y-C.y);if(d<b.r*1.15+8&&d<bd){best=b;bd=d}});
 if(best){best.grab=1;best.gx=C.x-best.x;best.gy=C.y-best.y;G=best;snd('grab');ring(best.x,best.y,8,300,.6,2)}});
cv.addEventListener('pointermove',e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const[a,b]=[...pts.values()];CAM.tz=cl(pz0*Math.hypot(a[0]-b[0],a[1]-b[1])/pd0,.6,2.4);return}C.touch=e.pointerType!=='mouse';[C.x,C.y]=w2(e);C.in=true;
 if(S.remove&&C.down){let ch=false;B=B.filter(b=>{if(b.hide)return true;const d=Math.hypot(b.x-C.x,b.y-C.y);if(d<b.r*1.2+12){ring(b.x,b.y,16,400,.8,3);ch=true;return false}return true});if(ch){snd('burst');structChanged()}}});

cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!C.down)C.in=false});

 if(b&&!RM){const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left-r.width/2)*.18+'px');b.style.setProperty('--my',(e.clientY-r.top-r.height/2)*.28+'px')}});

const dock=$('#dock'),pop=$('#pop'),panels={};

let th;txt.oninput=()=>{clearTimeout(th);th=setTimeout(()=>setText(txt.value),220)};txt.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')txt.blur()};dock.append(txt);
const dm={};['obj','mode','mat','pre','tune'].forEach(id=>{dm[id]=mkb(dock,id.toUpperCase(),null,()=>{const open=pop.classList.contains('open')&&panels[id].classList.contains('on');Object.values(panels).forEach(p=>p.classList.remove('on'));if(open)pop.classList.remove('open');else{panels[id].classList.add('on');pop.classList.add('open')}});});
const pO=panel('obj'),pM=panel('mode'),pT=panel('mat'),pP=panel('pre'),pU=panel('tune');

MODES.forEach(m=>mkb(pM,m,()=>S.mode===m,()=>setMode(m)));

const PR={cinematic:{mode:'magnet',mat:0,col:0,a:.9,cam:'PUSH',parts:1,gl:0,ms:[0,1]},chaos:{mode:'chaos',mat:4,col:2,a:.12,cam:'AUTO',parts:1,gl:0,ms:[4,6]},minimal:{mode:'wind',mat:0,col:0,a:.6,cam:'PUSH',parts:0,gl:0,ms:[0,5]},glitch:{mode:'repel',mat:6,col:1,a:.3,cam:'AUTO',parts:1,gl:1,ms:[6,2]},organic:{mode:'liquid',mat:3,col:4,a:.5,cam:'FOLLOW',parts:1,gl:0,ms:[3,7]},future:{mode:'orbit',mat:2,col:1,a:.3,cam:'ORBIT',parts:1,gl:0,ms:[2,1]},dream:{mode:'wind',mat:7,col:3,a:1.1,cam:'PULL',parts:1,gl:0,ms:[7,1,4]}};

Object.keys(PR).forEach(k=>mkb(pP,k,null,()=>preset(k)));
const sl=(l,key,a,b,s)=>{const w=document.createElement('label');w.textContent=l;const i=document.createElement('input');i.type='range';i.min=a;i.max=b;i.step=s;i.value=P[key];i.oninput=()=>P[key]=+i.value;w.append(i);pU.append(w)};
sl('gravity','g',0,3000,10);sl('bounce','b',0,1,.01);sl('friction','f',0,1,.01);sl('air resistance','a',0,3,.01);
COL.forEach((c,i)=>{const b=mkb(pU,'',()=>S.col===i,()=>{S.col=i;structChanged()},'sw');b.style.background=`rgb(${c})`;b.setAttribute('aria-label','Colour '+(i+1))});

const dBrk=mkb(dock,'BREAK',null,()=>S.broken?rebuild():brk()),dMor=mkb(dock,'MORPH',null,morph);

const dRem=mkb(dock,'REMOVE',()=>S.remove,()=>{S.remove=!S.remove;doc.classList.toggle('remove-mode',S.remove);if(S.remove)toast('REMOVE TOOL ACTIVE • CLICK ANY PARTICLE TO DELETE');else toast('REMOVE TOOL OFF');sync();snd('grab')},'rm-btn');

mkb(r1,'PAUSE',null,()=>{RP.play=!RP.play;if(RP.play&&RP.t>=RP.dur-.01)RP.t=0}).id='pp';mkb(r1,'REVERSE',()=>RP.dir<0,()=>RP.dir*=-1);mkb(r1,'LOOP',()=>RP.loop,()=>RP.loop=!RP.loop);
[.25,.5,1,2].forEach(s=>mkb(r1,s+'X',()=>RP.speed===s,()=>RP.speed=s));r1.insertAdjacentHTML('beforeend','<span id="tm"></span>');
CAMS.forEach(c=>mkb(r2,'<i>CAM</i>'+c,()=>RP.camMode===c,()=>RP.camMode=c));
Object.keys(FM).forEach(f=>mkb(r3,f,()=>S.fmt===f,()=>S.fmt=f));mkb(r3,'EXPORT VIDEO',null,exportVideo);mkb(r3,'PNG',null,exportPNG);mkb(r3,'REMIX',null,()=>remix());
$('#scrub').oninput=e=>{RP.play=false;RP.t=e.target.value/1000*RP.dur};
const rr=$('#rr');mkb(rr,'DOWNLOAD',null,()=>save(RP.blob,`motion-lab-teja-priyan.${RP.ext||'webm'}`));mkb(rr,'REPLAY',null,()=>{doc.classList.remove('res');RP.t=0;RP.play=true});mkb(rr,'REMIX',null,()=>remix());mkb(rr,'CREATE NEW',null,()=>{doc.classList.remove('res','rp');RP.on=false;Rc.frames=[];Rc.structs=[];B=[];S.parents=null;S.broken=false;spawn(S.text,true);sync()});

$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,220/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);B.push(mk({k:'image',img:c,r:70,m:3,x:W/2,y:H*.2,hx:W/2,hy:H*.35}));structChanged()};im.src=URL.createObjectURL(f)};

addEventListener('keydown',e=>{if(e.target===txt||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();

let last=0,fa=0,fn=0,hf=0;
function tick(ts){requestAnimationFrame(tick);const raw=Math.min((ts-last)/1000||.016,.05);last=ts;T+=raw;
 if(S.pm<0){fa+=raw;if(++fn===90){if(fa/90>1/42&&S.perf<2)setPerf(S.perf+1);fa=fn=0}}
 let V;
 if(RP.on){replayTick(raw);pu(raw);V=viewOf(0);V.floor=RP.mode===0;if(RP.exp){const x=RP.exp;render(x.ex,x.ow,x.oh,x.ww,viewOf(1));if(S.sign)sig(x.ex,x.ow,x.oh);const p=RP.t/RP.dur,n=Math.round(p*18);$('#bar').textContent='█'.repeat(n)+'░'.repeat(18-n);$('#pct').textContent=Math.round(p*100)+'%'}}
 else{
  const dt=raw;const ivx=(C.x-C.px)/dt,ivy=(C.y-C.py)/dt;C.px=C.x;C.py=C.y;const nx=C.vx+(ivx-C.vx)*.25,ny=C.vy+(ivy-C.vy)*.25;C.ax=(nx-C.vx)/dt;C.ay=(ny-C.vy)/dt;C.vx=nx;C.vy=ny;C.sp=Math.hypot(nx,ny);C.dir=Math.atan2(ny,nx);C.en+=(Math.min(C.sp/2400,1)-C.en)*.1;
  C.press=C.down?Math.min(C.press+dt,2.5):Math.max(C.press-dt*4,0);
  if(!C.in){C.vx*=.9;C.vy*=.9}
  const sub=Math.min(4,Math.ceil(dt*120));for(let i=0;i<sub;i++)step(dt/sub);
  if(S.parts&&C.in){const n=C.sp/180+(C.down?1.5:0)+.15;for(let i=Math.floor(n)+(R_()<n%1?1:0);i>0;i--)emit(C.x,C.y,C.vx*.12+(R_()-.5)*80,C.vy*.12+(R_()-.5)*80,.9,2.5)}
  if(!RM)CAM.sh=Math.min(CAM.sh+IMP*1,2);CAM.z+=(CAM.tz-CAM.z)*(1-Math.exp(-dt*4));CAM.sx=(R_()-.5)*CAM.sh*20;CAM.sy=(R_()-.5)*CAM.sh*20;CAM.sh*=Math.exp(-dt*7);
  if(Rc.on)recFrame();IMP=0;pu(raw);
  if(++hf%8===0)$('#hud').textContent=doc.classList.contains('lab')?'ENERGY '+(C.en<.15?'LOW':C.en<.5?'MID':'HIGH'):'';
  V={list:B,cam:CAM,mat:S.mat,col:S.col,cur:{x:C.in?C.x:-999,y:C.y,down:C.down},en:C.en,floor:S.mode==='gravity',gl:S.glitch}}
 render(cx,cv.width,cv.height,W,V)}
size();setPerf(((navigator.hardwareConcurrency||4)<=4||matchMedia('(pointer:coarse)').matches)?1:0);sync();
Promise.race([document.fonts.load('800 100px Syne').catch(()=>{}),new Promise(r=>setTimeout(r,1500))]).then(()=>{spawn(S.text,true);requestAnimationFrame(tick)});
